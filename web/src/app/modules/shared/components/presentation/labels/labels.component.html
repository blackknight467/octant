@if (title) {
<div class="label-with-title clr-col-md-12">
  <h3>{{ title }}</h3>
  <div class="view-labels">
    @if (labels) {
    <app-overflow-labels [labels]="labels"></app-overflow-labels>
    }
  </div>
</div>
} @else {
<div class="view-labels">
  @if (labels) {
  <app-overflow-labels [labels]="labels"></app-overflow-labels>
  }
</div>
}
