@if (v?.config?.buttonGroup) {
<div class="clr-row clr-align-items-center clr-justify-content-between">
  <div class="clr-col-2">
    <div class="action-buttons">
      <app-button-group [view]="buttonGroup"></app-button-group>
    </div>
  </div>
</div>
} @if (alert) {
<app-alert [alert]="alert"></app-alert>
} @if (v?.config?.sections) { @for (section of sections; track $index) {
<div class="clr-row">
  @for (item of section; track $index) {
  <div class="clr-col-md-{{ item.width / 2 }} content-card-parent">
    <app-view-container [view]="item.view"></app-view-container>
  </div>
  }
</div>
} }
