<div class="rv-filter-bar">
  <span class="rv-filter-label">Show:</span>
  @for (kind of filterableKinds; track kind) {
  <clr-checkbox-wrapper class="rv-filter-check">
    <input
      type="checkbox"
      clrCheckbox
      [checked]="isKindVisible(kind)"
      (change)="toggleKind(kind)"
      [id]="'rv-filter-' + kind"
    />
    <label [for]="'rv-filter-' + kind">{{ kind }}</label>
  </clr-checkbox-wrapper>
  }

  <span class="rv-filter-sep"></span>

  <span class="rv-filter-label">Depth:</span>
  <div class="rv-depth-control">
    <button
      class="btn btn-sm btn-icon"
      (click)="decrementDepth()"
      title="Decrease depth"
    >
      <clr-icon shape="minus"></clr-icon>
    </button>
    <span class="rv-depth-value">{{ maxDepth !== null ? maxDepth : '∞' }}</span>
    <button
      class="btn btn-sm btn-icon"
      (click)="incrementDepth()"
      title="Increase depth"
      [disabled]="maxDepth !== null && maxDepth >= maxDepthLimit"
    >
      <clr-icon shape="plus"></clr-icon>
    </button>
    @if (maxDepth !== null) {
    <button
      class="btn btn-sm btn-link rv-depth-clear"
      (click)="clearDepth()"
      title="Remove depth limit"
    >
      <clr-icon shape="times"></clr-icon>
    </button>
    }
  </div>
</div>

<div
  #resourceViewer
  class="resourceViewer"
  mwlResizable
  [resizeCursors]="resizeCursors()"
  (resizing)="updateSliderPosition($event)"
  (resizeStart)="resizeStart()"
  (resizeEnd)="resizeEnd()"
>
  <div #viewContainer class="view-container">
    <app-cytoscape
      [elements]="graphData"
      [layout]="layout"
      [zoom]="zoom"
      [style]="style"
      [selectedNodeId]="selectedNodeId"
      (select)="nodeChange($event)"
      (doubleClick)="openNode($event)"
    >
    </app-cytoscape>
  </div>
  <div class="gutter" mwlResizeHandle [resizeEdges]="resizeEdges"></div>
  <div #statusContainer class="status-container">
    <app-view-object-status [node]="selectedNode()"></app-view-object-status>
  </div>
</div>
