<cds-button
  [attr.action]="style"
  [attr.status]="status"
  [attr.size]="size"
  [attr.disabled]="disabled"
  [attr.block]="block"
  (click)="
    onClick(
      $safeNavigationMigration(v?.config?.payload),
      $safeNavigationMigration(v?.config?.confirmation),
      $safeNavigationMigration(v?.config?.modal)
    )
  "
>
  {{ v?.config?.name }}
</cds-button>

@if (modalView) {
<app-view-modal [view]="modalView"></app-view-modal>
}
<cds-modal
  id="confirmation-modal"
  [closable]="true"
  [hidden]="true"
  (closeChange)="toggleModal()"
>
  <cds-modal-header>
    <h3 cds-text="title" cds-first-focus tabindex="-1">{{ modalTitle }}</h3>
  </cds-modal-header>
  <cds-modal-content>
    <div [innerHTML]="modalBody" ngPreserveWhitespaces></div>
  </cds-modal-content>
  <cds-modal-actions>
    <cds-button action="outline" (click)="toggleModal()">Cancel</cds-button>
    <cds-button (click)="acceptModal()">OK</cds-button>
  </cds-modal-actions>
</cds-modal>
