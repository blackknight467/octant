<div class="breadcrumb">
  @if (path?.length > 1) {
  <div class="breadcrumb-body">
    @for (segment of path; track identifyPath(i, segment); let i = $index) {
    <div class="breadcrumb-item">
      @if (i !== 0) {
      <clr-icon shape="angle" class="separator"></clr-icon>
      }
      <app-view-container [view]="segment"></app-view-container>
    </div>
    }
  </div>
  }
  <h2 class="breadcrumb-header">
    {{ header }}
  </h2>
</div>
