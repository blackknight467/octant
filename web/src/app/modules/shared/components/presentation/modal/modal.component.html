<cds-modal
  [size]="size"
  id="app-modal"
  [hidden]="!opened"
  [closable]="true"
  (closeChange)="toggleModal()"
>
  <cds-modal-header>
    <h3 cds-text="title" cds-first-focus tabindex="-1">
      <app-view-title [views]="title"></app-view-title>
    </h3>
  </cds-modal-header>
  <cds-modal-content>
    <app-alert [alert]="alert"></app-alert>
    <app-view-container [view]="body"></app-view-container>
    @if (form?.fields) {
    <app-form #modalAppForm [form]="form"></app-form>
    }
  </cds-modal-content>
  <cds-modal-actions>
    @if (buttons) { @for (button of buttons; track trackByFn($index, button);
    let isLast = $last) {
    <button
      type="button"
      class="btn"
      [ngClass]="isLast ? 'btn-primary' : 'btn-outline'"
      (click)="onClick(button.payload)"
    >
      {{ button.name }}
    </button>
    } } @if (form?.fields) {
    <cds-button action="outline" (click)="opened = false">Cancel</cds-button>
    <cds-button (click)="onFormSubmit()">Submit</cds-button>
    } @if (!buttons && !form?.fields) {
    <cds-button (click)="opened = false">Close</cds-button>
    }
  </cds-modal-actions>
</cds-modal>
