@if (status && iconShape) { @if (!detail) {
<clr-icon
  shape="{{ iconShape }}"
  status="{{ currentStatus }}"
  size="16"
  solid
></clr-icon>
} @else {
<clr-signpost>
  <clr-icon
    shape="{{ iconShape }}"
    status="{{ currentStatus }}"
    size="16"
    clrSignpostTrigger
    solid
  ></clr-icon>
  <span style="margin-right: 4px"></span>
  <clr-signpost-content *clrIfOpen>
    <app-view-container [view]="detail"></app-view-container>
  </clr-signpost-content>
</clr-signpost>
} }
