<div class="card">
  <div class="card-block">
    <ng-container
      *ngTemplateOutlet="currentAction ? action : content"
    ></ng-container>
  </div>
  <ng-container
    *ngTemplateOutlet="currentAction ? formFooter : actionFooter"
  ></ng-container>
</div>

<ng-template #action>
  <h3 class="card-title">{{ currentAction.title }}</h3>
  <app-form #appForm [form]="currentAction.form"> </app-form>
</ng-template>

<ng-template #formFooter>
  <div class="card-footer">
    <button
      class="btn btn-primary btn-sm"
      type="submit"
      (click)="onActionSubmit()"
    >
      Submit
    </button>
    <button class="btn btn-sm" type="button" (click)="onActionCancel()">
      Cancel
    </button>
  </div>
</ng-template>

<ng-template #actionFooter>
  @if (v?.config.actions?.length > 0) {
  <div class="card-footer">
    @for (action of v?.config.actions; track trackByFn($index, action)) {
    <button class="btn btn-sm btn-link" (click)="setAction(action)">
      {{ action.name }}
    </button>
    }
  </div>
  }
</ng-template>

<ng-template #content>
  @if (v?.config.alert) {
  <app-alert [alert]="$safeNavigationMigration(v?.config.alert)"></app-alert>
  }
  <h4 class="card-title">
    <app-view-title [views]="title"></app-view-title>
  </h4>

  <div class="card-text">
    <app-view-container [view]="body"></app-view-container>
  </div>
</ng-template>
