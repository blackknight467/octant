<div class="input-filter">
  <div class="input-filter-control">
    <input
      clrInput
      class="text-input"
      placeholder="{{ filters | filtertext }}"
      name="input"
      [(ngModel)]="inputValue"
      (keyup.enter)="onEnter()"
    />
    <clr-icon
      class="down-icon"
      (click)="toggleTagList()"
      shape="angle"
      direction="down"
    ></clr-icon>
  </div>
  @if (showTagList) {
  <div class="input-filter-tags">
    @if (filters?.length < 1) {
    <div class="input-filter-empty">No current filters</div>
    } @if (filters?.length > 0) {
    <div class="input-filter-tags-list">
      @for (filter of filters; track identifyFilter($index, filter)) {
      <div class="label label-light-blue">
        {{ filter.key }}:{{ filter.value }}
        <clr-icon
          class="input-filter-tag-remove"
          shape="times"
          size="sm"
          (click)="remove(filter)"
        ></clr-icon>
      </div>
      }
    </div>
    <div class="clear-all" (click)="clearAllFilters()">clear all</div>
    }
  </div>
  }
</div>
